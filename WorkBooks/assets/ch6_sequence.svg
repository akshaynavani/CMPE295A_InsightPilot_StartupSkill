<text x="820.0" y="962.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.440000000000001" font-weight="400" fill="#64748b">Steps 9-15 repeat for every PlanStep. Every StepResult returns to the Orchestrator; verification (13) never calls a model. Plan (5) and SQL (10) use the frontier model, prose (16) the small one.</text>
<text x="820.0" y="984.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.440000000000001" font-weight="400" fill="#64748b">Not drawn, described in the text: clarifying an ambiguous term, SQL repair on error, cross-source reconciliation, and halting on a RED hop.</text>
<text x="820.0" y="1006.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.32" font-weight="400" font-style="italic" fill="#64748b">Solid arrow = call; dashed arrow = return or reply.</text>
